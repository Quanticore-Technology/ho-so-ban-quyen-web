<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- No third-party scripts. AI calls go only to the provider the user configures (any https host, or a local model). -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https: http://localhost:* http://127.0.0.1:* ws://localhost:*; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="description" content="Chuẩn bị hồ sơ đăng ký quyền tác giả cho chương trình máy tính. Miễn phí, dữ liệu ở lại trên máy.">
<title>Hồ sơ Bản quyền</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='none' stroke='%23b8261c' stroke-width='3'/%3E%3Ctext x='16' y='21' text-anchor='middle' font-size='14' font-family='serif' fill='%23b8261c'%3E©%3C/text%3E%3C/svg%3E">
  <script type="module" crossorigin src="./assets/index-Dz4bqzGA.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-BOpG6S9v.css">
</head>
<body>

<header class="top">
  <button class="brand" data-act="home" aria-label="Về trang chủ"><span class="seal-sm">©</span><span>HỒ SƠ BẢN QUYỀN</span></button>
  <span class="draft-name" id="draftName" hidden></span>
  <span class="spacer"></span>
  <span class="saved" id="savedLbl" hidden>✓ đã lưu trên máy</span>
  <button class="btn ghost sm on-desk" id="saveFileBtn" data-act="save-file" hidden>↓ <span class="hide-sm">Lưu file hồ sơ</span></button>
  <button class="btn sm on-desk" data-act="ai-settings" aria-label="Cài đặt AI">AI<span class="ai-state" id="aiState">&nbsp;· chưa bật</span></button>
</header>

<div id="app"></div>

<input type="file" id="fileJson" accept=".json,application/json" hidden>
<input type="file" id="fileZip" accept=".zip,application/zip" hidden>
<input type="file" id="fileShot" accept="image/*" multiple hidden>

<dialog id="dlgSettings">
  <div class="dlg-h"><h3>Cài đặt AI</h3><button class="btn ghost sm" data-act="close" aria-label="Đóng">✕</button></div>
  <div class="dlg-b">
    <div class="grid">
      <div class="field full"><label for="provider">Nhà cung cấp</label><select id="provider"></select></div>
      <div class="field full" id="keyField"><label for="apiKey">API key</label><input id="apiKey" type="password" autocomplete="off" spellcheck="false"></div>
      <div class="field full"><label for="model">Model</label><select id="model"></select><div class="help" id="modelHelp"></div></div>
    </div>
    <label class="chip switch"><input type="checkbox" id="remember"><span class="box"></span><span>Ghi nhớ trên thiết bị này<small class="sub-small">Không chọn: key mất khi đóng tab.</small></span></label>
  </div>
  <div class="dlg-f"><button class="btn ghost sm" data-act="ai-clear">Xóa key</button><button class="btn stamp" data-act="ai-save">Lưu</button></div>
</dialog>

<dialog id="dlgAi">
  <div class="dlg-h"><h3>Viết mô tả bằng AI</h3><button class="btn ghost sm" data-act="close" aria-label="Đóng">✕</button></div>
  <div class="dlg-tabs" role="tablist">
    <button role="tab" aria-selected="true" data-act="ai-tab" data-tab="copy">Sao chép prompt</button>
    <button role="tab" aria-selected="false" data-act="ai-tab" data-tab="api">Dùng API key</button>
  </div>
  <div class="dlg-b" id="aiCopy">
    <ol class="steps-list">
      <li>Sao chép prompt bên dưới.</li>
      <li>Dán vào ChatGPT, Claude hoặc Gemini.</li>
      <li>Dán câu trả lời vào ô thứ hai, rồi bấm “Điền vào mô tả”.</li>
    </ol>
    <div class="field"><label for="promptBox" id="promptLbl">Prompt</label><textarea class="prompt-box" id="promptBox" readonly></textarea></div>
    <div class="row-between"><small id="promptSize" class="muted-i"></small><button class="btn sm" data-act="ai-copy">Sao chép</button></div>
    <div class="field"><label for="aiAnswer">Câu trả lời của AI</label><textarea id="aiAnswer" placeholder="dán vào đây…"></textarea></div>
  </div>
  <div class="dlg-b" id="aiApi" hidden></div>
  <div class="dlg-f"><button class="btn ghost sm" data-act="close">Hủy</button><button class="btn stamp" id="aiGo" data-act="ai-go">Điền vào mô tả</button></div>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
